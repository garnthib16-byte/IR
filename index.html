<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Île Recycle – État des stocks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
<script src="icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen text-stone-800">

<header class="sticky top-0 z-30 bg-white border-b border-stone-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <img src="logo.jpg" alt="Logo Île Recycle" class="h-11 w-auto shrink-0 rounded-md object-contain" />
      <div>
        <h1 class="font-bold text-lg leading-tight" style="color:#786b54">Île Recycle</h1>
        <p class="text-[11px] leading-tight" style="color:#a3a938">Écocentre de l'Île de Nantes</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="https://www.google.com/maps/dir/?api=1&destination=14+rue+de+la+Guyane%2C+Nantes+44200" target="_blank" rel="noopener" class="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg text-white hover:brightness-110" style="background:#1f4d3d" title="Itinéraire vers le dépôt">
        <i data-icon="lucide:map-pin" data-size="16px"></i>
        <span class="hidden sm:inline">Itinéraire</span>
      </a>
      <button type="button" class="copyAddrBtn flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-50 text-stone-600" title="Copier l'adresse">
        <i data-icon="lucide:copy" data-size="16px"></i>
        <span class="hidden sm:inline copyAddrLabel">Copier l'adresse</span>
      </button>
      <span id="lastSync" class="hidden sm:inline text-xs text-stone-400"></span>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

  <section id="summaryCards" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></section>

  <section class="bg-white rounded-2xl border border-stone-200 shadow-sm p-4 space-y-3">
    <div class="flex flex-col lg:flex-row lg:items-center gap-3">
      <div class="relative flex-1">
        <i data-icon="lucide:search" data-size="16px" class="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
        <input id="searchInput" type="text" placeholder="Rechercher un matériau (ex: sable, gravier, grave, terre végétale...)" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-[#1f4d3d]/40 text-sm" />
      </div>
      <div class="flex flex-wrap gap-2">
        <select id="categoryFilter" class="text-sm rounded-xl border border-stone-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#1f4d3d]/40"></select>
        <select id="availFilter" class="text-sm rounded-xl border border-stone-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#1f4d3d]/40">
          <option value="all">Toutes disponibilités</option>
          <option value="yes">Disponible</option>
          <option value="no">Indisponible</option>
        </select>
        <div class="flex rounded-xl border border-stone-300 overflow-hidden">
          <button id="viewGrid" class="px-3 py-2.5 bg-[#1f4d3d] text-white"><i data-icon="lucide:grid-2x2" data-size="16px"></i></button>
          <button id="viewList" class="px-3 py-2.5 bg-white text-stone-600"><i data-icon="lucide:list" data-size="16px"></i></button>
        </div>
        <a href="https://www.google.com/maps/dir/?api=1&destination=14+rue+de+la+Guyane%2C+Nantes+44200" target="_blank" rel="noopener" class="flex items-center gap-1.5 text-sm px-3 py-2.5 rounded-xl border border-stone-300 hover:bg-stone-50" title="Itinéraire vers le dépôt">
          <i data-icon="lucide:map-pin" data-size="16px"></i> Itinéraire
        </a>
        <button type="button" class="copyAddrBtn flex items-center gap-1.5 text-sm px-3 py-2.5 rounded-xl border border-stone-300 hover:bg-stone-50" title="Copier l'adresse">
          <i data-icon="lucide:copy" data-size="16px"></i> <span class="copyAddrLabel">Copier</span>
        </button>
      </div>
    </div>
    <p id="resultCount" class="text-xs text-stone-500"></p>
    <p id="connStatus" class="text-xs rounded-lg px-3 py-2 bg-stone-100 text-stone-500">Connexion à la base en cours...</p>
  </section>

  <section id="gridView" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
  <section id="listView" class="hidden bg-white rounded-2xl border border-stone-200 shadow-sm overflow-x-auto"></section>

  <p class="text-xs text-stone-400 flex items-center gap-1.5"><i data-icon="lucide:info" data-size="14px"></i> Données synchronisées en temps réel avec notre base partagée — identiques pour tous les visiteurs.</p>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
